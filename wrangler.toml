# wrangler.toml

name = "caitvi-hub-backend"
compatibility_date = "2026-01-19"

[[d1_databases]]
binding = "DB"
database_name = "caitvi-hub"
database_id = "c5186f8c-7722-4191-a651-3be6ff754648"

# Voice clips for owner-authored works. Create once with:
#   pnpm wrangler r2 bucket create caitvi-hub-audio
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "caitvi-hub-audio"
